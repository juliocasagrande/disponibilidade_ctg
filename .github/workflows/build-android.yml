name: Build Android APK (CTG Disponibilidade)

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - 'scripts/painel/**'
      - 'scripts/app/mobile.py'

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependencias Python e gerar bundle mobile
        run: |
          python -m pip install -r requirements.txt
          python -m scripts.executar --sync-mobile

      - name: Instalar Capacitor e sincronizar Android
        working-directory: mobile
        run: |
          npm install
          npx cap sync android

      - name: Compilar APK Debug
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctg-disponibilidade-android-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
